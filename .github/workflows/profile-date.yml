name: Refresh profile

on:
  workflow_dispatch:
  schedule:
    # 00:17 UTC = 07:17 WIB; avoid the busiest top-of-hour window.
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: profile-date
  cancel-in-progress: false

jobs:
  refresh-date:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test profile updaters
        run: python -m unittest discover -s .github/scripts -v
      - name: Update most-starred repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/update_top_repos.py
      - name: Update date in WIB
        run: python .github/scripts/update_profile_date.py
      - name: Commit date if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh profile date and top repositories [skip ci]"
          git push
